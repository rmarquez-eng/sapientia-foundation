name = "sapientia-foundation"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Rate-limit + abuse-cap store for the credit tool and the letter mailer.
[[kv_namespaces]]
binding = "RL"
id = "db8ea8f965314f8bb31ab329a3cb706a"

# Secrets (never in this file). Set only if the Foundation opts in to the
# "we'll mail it for you" service:
#   npx wrangler pages secret put LETTERSTREAM_API_ID
#   npx wrangler pages secret put LETTERSTREAM_API_KEY
